<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Church</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;padding:20px}
.form{max-width:700px;margin:auto;background:#111a2e;padding:20px;border-radius:10px}
input,textarea,select{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none}
button{padding:12px 20px;background:#2d6cdf;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="form">
<h1>⛪ Create Church</h1>
<input type="text" placeholder="Church Name">
<input type="text" placeholder="Founder / Pastor">
<input type="email" placeholder="Church Email">
<input type="tel" placeholder="Phone Number">
<input type="text" placeholder="Country">
<input type="text" placeholder="City">
<select>
<option>Church Type</option>
<option>Pentecostal</option>
<option>Catholic</option>
<option>Anglican</option>
<option>Baptist</option>
<option>Other</option>
</select>
<textarea placeholder="Church Description"></textarea>
<button onclick="alert('Church Created Successfully')">Create Church</button>
</div>
</body>
</html>
